name: Verify retained Windows installer and WebView transport
on:
  push:
    branches: [feat/2722-one-host-provider]
    paths: [.github/workflows/windows-candidate-startup.yml]

permissions:
  actions: read
  contents: read

jobs:
  startup:
    if: github.event.repository.fork
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0 # same as the candidate build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 14691710523
          run-id: 44860949534
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/retained-control/target/release/bundle/nsis
      - name: Verify the exact packaging and Playwright startup checks on preview.1
        shell: pwsh
        run: |
          $control = "$env:RUNNER_TEMP\retained-control"
          $bundle = "$control\target\release\bundle\nsis"
          $setup = Get-Item "$bundle\Buzz_1.0.7-preview.1_x64_unsigned.exe"
          if ((Get-Content "$bundle\SOURCE_COMMIT" -Raw).Trim() -ne 'e3c74c424ef067a2e27a30a75eb7c574ee9936fd' -or
              (Get-FileHash $setup).Hash -ne '339ed55625e48b7e0a547349caf9a0b9ebed38f46f6aef0b9ccf52472fd6fb5c') { throw 'Unexpected retained installer' }
          $dest = "$env:RUNNER_TEMP\candidate-install"
          $install = Start-Process $setup.FullName -ArgumentList "/S /D=$dest" -PassThru -Wait
          if ($install.ExitCode -ne 0 -or (Get-FileHash "$dest\Buzz.exe").Hash -ne '1266f0abf449a235114af8a17df5031b31042f58cff007e6fb5885e67d0896bb') { throw 'Unexpected retained executable' }

          # Exercise the committed probe up through its first signed-out response.
          # The scratch script ends there so preview.1 receives no registered-host command.
          $source = Get-Content 'scripts/verify-windows-registered-hosts.mjs' -Raw
          $end = 'assert.equal(await identity(), null, "candidate runner must be signed out");'
          $cut = $source.IndexOf($end)
          if ($cut -lt 0 -or $cut -ne $source.LastIndexOf($end)) { throw 'Missing or ambiguous startup boundary' }
          $probe = $source.Substring(0, $cut + $end.Length)
          if ($probe.Contains('registered_host_')) { throw 'Unsafe command in preview.1 control' }
          $probe = $probe.Replace('the installed WebView rejects signed-out host commands and stays responsive', 'the retained installed WebView returns a signed-out identity')
          New-Item "$control\scripts" -ItemType Directory | Out-Null
          ($probe + "`n});") | Set-Content "$control\scripts\verify-windows-registered-hosts.mjs" -Encoding utf8
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).devDependencies.'@playwright/test'
          Set-Location $control
          npm install --no-audit --no-fund --ignore-scripts --prefix . "@playwright/test@$version"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to load pinned Playwright' }
          & "$env:GITHUB_WORKSPACE\scripts\verify-windows-registered-hosts.ps1"
